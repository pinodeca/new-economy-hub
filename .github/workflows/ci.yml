name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Content checks run before lint/build so a bad content file fails on its
      # own named step with a readable message, rather than deep inside a build
      # log. `npm run build` also runs validate:content via `prebuild`, which is
      # what protects the Azure deploy — that workflow doesn't run these steps.
      - run: npm run validate:content

      - run: npm run test:content

      - run: npm run lint

      - run: npm run build
